<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<title>Vinancial Capital</title>
<meta name="description" content="Equipment financing for Latino-owned businesses." />
<script>
  (function () {
    try {
      var SUPPORTED = ['es', 'fr', 'en'];
      var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
      var chosen = 'en';
      outer: for (var i = 0; i < langs.length; i++) {
        var code = (langs[i] || '').toLowerCase().split('-')[0];
        for (var j = 0; j < SUPPORTED.length; j++) {
          if (code === SUPPORTED[j]) {
            chosen = SUPPORTED[j];
            break outer;
          }
        }
      }

      var CA_ZONES = [
        'America/Toronto', 'America/Montreal', 'America/Vancouver', 'America/Edmonton',
        'America/Winnipeg', 'America/Halifax', 'America/St_Johns', 'America/Regina',
        'America/Iqaluit', 'America/Whitehorse', 'America/Yellowknife', 'America/Dawson',
        'America/Dawson_Creek', 'America/Creston', 'America/Fort_Nelson', 'America/Glace_Bay',
        'America/Goose_Bay', 'America/Moncton', 'America/Blanc-Sablon', 'America/Nipigon',
        'America/Thunder_Bay', 'America/Rainy_River', 'America/Atikokan', 'America/Swift_Current',
        'America/Cambridge_Bay', 'America/Inuvik', 'America/Resolute', 'America/Rankin_Inlet'
      ];
      var region = '';
      try {
        var localeParts = (navigator.language || '').split('-');
        if (localeParts.length > 1) region = localeParts[1].toUpperCase();
      } catch (e) {}
      var tz = '';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
      var isCanada = region === 'CA' || CA_ZONES.indexOf(tz) !== -1;
      var currency = isCanada ? 'CAD' : 'USD';

      document.documentElement.lang = chosen;
      window.__VC_LANG__ = chosen;
      window.__VC_CURRENCY__ = currency;

      var TITLES = {
        es: 'Vinancial Capital | Financiamiento de equipo para negocios de dueños latinos',
        fr: "Vinancial Capital | Financement d'équipement pour les entreprises latino-américaines",
        en: 'Vinancial Capital | Equipment financing for Latino-owned businesses'
      };
      var DESCRIPTIONS = {
        es: 'Ayudamos a negocios de dueños latinos en Canadá y Estados Unidos a financiar el equipo que los mantiene funcionando.',
        fr: "Nous aidons les entreprises latino-américaines au Canada et aux États-Unis à financer l'équipement qui les fait tourner.",
        en: 'We help Latino-owned businesses across Canada and the United States finance the equipment that keeps them running.'
      };
      document.title = TITLES[chosen];
      var meta = document.querySelector('meta[name="description"]');
      if (meta) meta.setAttribute('content', DESCRIPTIONS[chosen]);
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
